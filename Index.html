<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASADAS</title>
    <style>
        /* 画面全体のスタイル設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center; /* 左右の中央揃え */
            align-items: center;     /* 上下の中央揃え */
            background-color: #f8f9fa; /* 背景色（薄いグレー） */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        /* 「ASADAS」の文字スタイル */
        .centered-text {
            font-size: 10vw; /* 画面の横幅に合わせて文字サイズが自動調整されます */
            font-weight: 900; /* 太字 */
            color: #1a1a1a;   /* 文字色（濃いグレー） */
            letter-spacing: 0.05em; /* 文字と文字の間隔 */
            user-select: none; /* 文字を選択不可にしてデザイン性を保持 */
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 画面に表示される文字列 -->
    <div class="centered-text">ASADAS</div>

</body>
</html>
